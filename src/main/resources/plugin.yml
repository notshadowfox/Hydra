name: HydraMain
version: 2.0.257
main: hgloot.plugin.HGLootPlugin
api-version: '1.21'
author: Hydra Network
description: Native HG loot plugin with GUI, chest generation, and audit books
depend: [voicechat]

commands:
  menu:
    description: Opens the Hydra player menu
    usage: /menu
  admin:
    description: Opens the Hydra admin root and staff submenus
    usage: /admin [gift <player|@a>|battlepass|br switch <profile>|hg|bossrush|bosses|weapons|waves|structures|cosmetics|economy|wallet|warnings|ah|hotbar|sethub|debug|maintenance|transition test]
  maintenance:
    description: Toggle Hydra maintenance mode
    usage: /maintenance <on|off|status|add|remove> [player]
  br:
    description: Battle Royale queue commands
    usage: /br <join|leave|status|forcestart|win|cleanup|help>
  hg:
    description: Hunger Games queue commands
    usage: /hg <join|leave|status|info|forcestart|win|cleanup|help>
  spleef:
    description: Spleef minigame queue commands
    permission: hgloot.admin
    usage: /spleef <join|leave|status>
  voidroulette:
    description: Void Roulette minigame queue commands
    permission: hgloot.admin
    aliases: [vr]
    usage: /voidroulette <join|leave|status>
  maceroulette:
    description: Alias for Void Roulette minigame queue commands
    permission: hgloot.admin
    usage: /maceroulette <join|leave|status>
  bridge:
    description: Bridge minigame queue commands
    permission: hgloot.admin
    usage: /bridge <join|leave|status>
  roulette:
    description: Minigame Roulette queue commands
    usage: /roulette <join|leave|status|ignorepr>
  hub:
    description: Send yourself to hub
    usage: /hub
    aliases: [lobby]
  world:
    description: Teleport to another world on this server
    usage: /world <name>
  resetlegendarycooldowns:
    description: Reset all registered legendary cooldowns for yourself or a target
    usage: /resetlegendarycooldowns [player]
    aliases: [rlc]
  recipes:
    description: Open the Hydra recipe book
    usage: /recipes
    aliases: [recipe]
  pedestal:
    description: Place, refill, or remove legendary pedestals
    usage: /pedestal <place|refill|remove> [recipeId]
  cosmetics:
    description: Opens the Hydra player cosmetics menu
    usage: /cosmetics
  friend:
    description: Friend requests and friend list
    usage: /friend <add|accept|deny|remove|block|unblock|list|requests> ...
    aliases: [friends]
  party:
    description: Temporary lobby party commands
    usage: /party <create|join|invite|accept|deny|leave|disband|kick|promote|list|requests>
  social:
    description: Opens the Social menu with Friends and Party options
    usage: /social
  pc:
    description: Toggle Party Chat
    usage: /pc
  tc:
    description: Toggle Team Chat
    usage: /tc
  partychat:
    description: Toggle Party Chat
    usage: /partychat
  teamchat:
    description: Toggle Team Chat
    usage: /teamchat
  team:
    description: Shows your assigned team
    usage: /team
  settings:
    description: Opens Hydra player settings
    usage: /settings [effects <full|reduced|minimal>]
  pversion:
    description: Show the current HydraMain plugin version
    usage: /pversion
  combatchamber:
    description: Temporary Combat Chamber test commands
    usage: /combatchamber <testvenom|finish|yes|no|stay|leave|venom wave set <1-4>>
  koth:
    description: Configure and run King of the Hill
    usage: /koth <setpos1|setpos2|start|stop|status|countdown|capture|earlystart|addtime|removetime|instantstart> ...
  ah:
    description: Opens the Hydra Auction House
    usage: /ah [claim|balance|audit|addcoins]
    aliases: [auction, auctionhouse]
  sell:
    description: Opens the cosmetic selling flow
    usage: /sell [startBidCoins]
  pay:
    description: Pay Hydra Coins to another player
    usage: /pay <player> <amount>
  shard:
    description: Open a Shard cosmetic reward crate
    usage: /shard open
  battlepass:
    description: Open the Hydra Battle Pass
    usage: /battlepass
    aliases: [bp]
  spectate:
    description: Spectate the active match a player is in
    usage: /spectate <player>
    aliases: [spec]
  wins:
    description: Admin win stat shortcuts
    usage: /wins reset [all|hg|br] <player>
  border:
    description: World border admin controls
    usage: /border <info|set|add|center|centerhere> ...
  withdrawheart:
    description: Turn one heart into a usable item
    usage: /withdrawheart
  back:
    description: Return to your previous command/plugin teleport location
    usage: /back
  gm:
    description: Short form of /gamemode
    usage: /gm <0|1|2|3|survival|creative|adventure|spectator>
  feed:
    description: Restore hunger and saturation
    usage: /feed [player]
  heal:
    description: Restore health
    usage: /heal [player]
  fly:
    description: Toggle personal flight
    usage: /fly
  god:
    description: Toggle personal god mode
    usage: /god
  announce:
    description: Broadcast an announcement
    usage: /announce <message>
  revive:
    description: Revive a match player from their last death snapshot
    usage: /revive [player]
  rejoin:
    description: Rejoin your active Hydra match or spectator session
    usage: /rejoin
  leave:
    description: Leave your active queue or match
    usage: /leave
  npc:
    description: Create and manage Hydra NPCs
    usage: /npc <create|delete|list|info|teleport|movehere|set|action|dialogue|refresh|reload|help>
  guide:
    description: Open Hydra's interactive server guide
    usage: /guide
  leaderboard:
    description: View and manage Hydra leaderboards
    usage: /leaderboard <wins total|wins hg|wins br|kills|level|coins|place|switch|refresh|reload|clear|forceupdate|debug>
  rank:
    description: Manage Hydra+ and staff ranks
    usage: /rank <give|set|remove|menu> ...
  warn:
    description: Warn a player and record the warning
    usage: /warn <player> <reason>
  warnings:
    description: View or clear player warnings
    usage: /warnings <player> [clear]
  mute:
    description: Mute a player from chat
    usage: /mute <player> <duration|perm> <reason>
  unmute:
    description: Remove a player mute
    usage: /unmute <player>
  tempban:
    description: Temporarily ban a player from Hydra
    usage: /tempban <player> <duration> <reason>
  unban:
    description: Remove a temporary profile ban
    usage: /unban <player>
  kick:
    description: Kick a player from the server
    usage: /kick <player> [reason]
  report:
    description: Report a player to staff
    usage: /report <player> <reason>
  reports:
    description: View or clear player reports
    usage: /reports [list|clear]
  stats:
    description: View or administratively reset player stats
    usage: /stats reset <player|all> [confirmation]

